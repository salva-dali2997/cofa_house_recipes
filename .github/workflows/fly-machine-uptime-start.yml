name: Fly - Disable auto-stop (1st & 3rd Sunday, 12pm ET)

# GitHub Actions cron always runs in UTC and can't express "1st/3rd Sunday",
# so this fires on both possible UTC offsets for 12:00 ET (EDT and EST) and
# then verifies the real America/New_York date/time before doing anything.
on:
  schedule:
    - cron: "0 16 * * 0" # 12:00 EDT (UTC-4)
    - cron: "0 17 * * 0" # 12:00 EST (UTC-5)
  workflow_dispatch:

jobs:
  disable-autostop:
    runs-on: ubuntu-latest
    steps:
      - name: Check it's the 1st or 3rd Sunday at noon ET
        id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          dow=$(TZ=America/New_York date +%u)
          dom=$(TZ=America/New_York date +%d)
          run=false
          if [ "$dow" = "7" ] && [ "$hour" = "12" ]; then
            if { [ "$dom" -ge 1 ] && [ "$dom" -le 7 ]; } || { [ "$dom" -ge 15 ] && [ "$dom" -le 21 ]; }; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up flyctl
        if: steps.check.outputs.run == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Start machine and disable auto-stop
        if: steps.check.outputs.run == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          MACHINE_ID=$(flyctl machines list --json -a cofa-house-recipes | jq -r '.[0].id')
          flyctl machine start "$MACHINE_ID" -a cofa-house-recipes || true
          flyctl machine update "$MACHINE_ID" -a cofa-house-recipes --autostop=off -y
